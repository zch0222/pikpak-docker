; 容器里的全部进程都由 supervisord 以用户 app 运行
; 启动顺序按 priority，从小到大；各启动脚本自己等待 X 就绪
; supervisord 是 1 号进程，Wine 进程脱离父进程后也由它回收

[supervisord]
nodaemon=true
logfile=/tmp/log/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/tmp/supervisord.pid
childlogdir=/tmp/log

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/local/bin/run-xvfb
priority=10
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/tmp/log/xvfb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1

[program:x11vnc]
command=/usr/local/bin/run-x11vnc
priority=30
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/tmp/log/x11vnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/tmp/log/novnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1

; 客户端的输出由 run-pikpak 自己写进 /tmp/log/pikpak.log，不能经过 supervisord 的管道（原因见 run-pikpak）
[program:pikpak]
command=/usr/local/bin/run-pikpak
priority=50
autorestart=true
startsecs=15
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=NONE

; 限制 /tmp/log/pikpak.log 的大小：超过 20 MB 时转存到 pikpak.log.1 再清空
[program:logtrim]
command=/usr/local/bin/run-logtrim /tmp/log/pikpak.log 20
priority=60
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/log/logtrim.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
